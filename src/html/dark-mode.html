<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dark mode</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <h1 class="text-2xl">dark mode</h1>
    <button
      id="theme-toggle"
      class="mt-4 px-4 py-2 bg-gray-200 dark:bg-gray-700 text-black dark:text-white rounded"
    >
      Toggle Dark Mode
    </button>
    <div class="h-[1500px] bg-gray-200 dark:text-white dark:bg-gray-700">
      ini div
      <br />
      <a href="../index.html">back to home</a>
    </div>
    <script>
      // Cek preferensi yang tersimpan
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      } else if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }

      // Toggle mode gelap dan simpan preferensi
      document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        if (document.documentElement.classList.contains('dark')) {
          localStorage.setItem('theme', 'dark');
        } else {
          localStorage.setItem('theme', 'light');
        }
      });
    </script>
  </body>
</html>
