<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <p>1. breakpoints</p>
    <div class="sm:text-lg md:text-xl lg: text-2xl">text example</div>

    <p>2. responsive grid/flex</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-blue-200 p-4">1</div>
      <div class="bg-blue-300 p-4">2</div>
      <div class="bg-blue-400 p-4">3</div>
      <div class="bg-blue-500 p-4">4</div>
    </div>

    <p>3. aspect ration</p>
    <div class="aspect-w-16 aspect-h-9">
      <iframe
        src="https://www.youtube.com/embed/n4i1FMjMNiA?si=c-wgxfoIEiH4z_5g"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
    <a href="../index.html">back to home</a>
  </body>
</html>
